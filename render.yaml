# Render blueprint for the CuiSync web app (free plan).
# The OCR runs on a Hugging Face Space; this service calls it through OCR_API_URL.
services:
  - type: web
    name: cuisync
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-render.txt && python fetch_data.py
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 300
    healthCheckPath: /faqs
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OPENAI_MODEL
        value: gpt-4o
      # Keeps users logged in across restarts (Render makes a random value once)
      - key: SECRET_KEY
        generateValue: true
      # Accounts live in Supabase (accounts.py). Set these on the Render dashboard.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # First admin account (made in Supabase when there is no admin yet).
      - key: CUISYNC_ADMIN_USER
        value: admin
      - key: CUISYNC_ADMIN_EMAIL
        sync: false
      - key: CUISYNC_ADMIN_PASSWORD
        sync: false
      # Filled in on the Render dashboard (kept secret, not in GitHub):
      - key: OPENAI_API_KEY
        sync: false
      - key: OCR_API_URL       # e.g. https://your-username-cuisync-ocr.hf.space
        sync: false
      - key: OCR_API_TOKEN     # same password you set on the Space
        sync: false
      - key: HF_DATA_REPO      # e.g. your-username/cuisync-data
        sync: false
      - key: HF_TOKEN          # Hugging Face read token (the data repo is private)
        sync: false

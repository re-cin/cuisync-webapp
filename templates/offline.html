<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CUISYNC - You're offline</title>
  {% include "partials/pwa_head.html" %}
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: linear-gradient(160deg, #67080c, #800d12 60%, #9c151b);
      font-family: 'Poppins', system-ui, -apple-system, sans-serif;
      color: #eae3d2;
      text-align: center;
    }
    .card { max-width: 420px; }
    .logo { font-family: 'Playfair Display', Georgia, serif; font-size: 2.2rem; font-weight: 700; letter-spacing: 3px; color: #dcb349; }
    .diamond { color: #dcb349; margin: 14px 0; }
    h1 { font-family: 'Playfair Display', Georgia, serif; font-size: 1.5rem; color: #fff; margin-bottom: 10px; }
    p { font-size: 0.92rem; line-height: 1.6; color: #e0adad; margin-bottom: 26px; }
    button {
      border: 0; border-radius: 999px; padding: 12px 28px;
      background: #dcb349; color: #67080c; font-weight: 600; letter-spacing: 1.2px; font-size: 0.8rem; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">CUISYNC</div>
    <div class="diamond">&#9670;</div>
    <h1>You're offline</h1>
    <p>CuiSync needs the internet to search dishes, read menu photos and compare cuisines. Check your connection and try again.</p>
    <button type="button" onclick="location.reload()">TRY AGAIN</button>
  </div>
</body>
</html>

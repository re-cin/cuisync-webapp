{# PWA: app manifest, icons and the service worker. Included in every page's <head>. #}
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#800d12">
<link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='pwa/icons/favicon-32.png') }}">
<link rel="icon" type="image/png" sizes="64x64" href="{{ url_for('static', filename='pwa/icons/favicon-64.png') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='pwa/icons/apple-touch-icon.png') }}">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CuiSync">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="{{ url_for('static', filename='pwa/pwa.css') }}">
<script defer src="{{ url_for('static', filename='pwa/pwa.js') }}"></script>

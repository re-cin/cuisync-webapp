  {# Dish popup: the dish on the left, Recipe breakdown / Culture & history / Health info on the right.
   Used by the Dish Dictionary and the comparison page (Find dishes). Filled in by static/scripts/dish-popup.js. #}
  <div class="dp-overlay" id="dp-overlay" hidden>
    <div class="dp-dialog" role="dialog" aria-modal="true" aria-labelledby="dp-title" tabindex="-1">
      <button type="button" class="dp-close" id="dp-close" aria-label="Close">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>

      <!-- Left: the dish -->
      <aside class="dp-side">
        <div class="dp-img">
          <img id="dp-img" alt="" referrerpolicy="no-referrer">
          <span class="dp-country" id="dp-country"></span>
        </div>
        <div class="dp-side-body">
          <h2 class="dp-title" id="dp-title"></h2>
          <p class="dp-alt" id="dp-alt"></p>
          <div class="dp-tags dp-place" id="dp-tags"></div>
          <a class="dp-similar" id="dp-similar" href="#">
            Find similar dishes <span class="dp-similar-arrow" aria-hidden="true">&rarr;</span>
          </a>
        </div>
      </aside>

      <!-- Right: recipe breakdown / culture & history / health info -->
      <section class="dp-main">
        <div class="dp-tabs" role="tablist" aria-label="Dish details">
          <button type="button" class="dp-tab is-active" role="tab" id="dp-tab-recipe" data-tab="recipe" aria-controls="dp-panel-recipe" aria-selected="true">Recipe breakdown</button>
          <button type="button" class="dp-tab" role="tab" id="dp-tab-culture" data-tab="culture" aria-controls="dp-panel-culture" aria-selected="false" tabindex="-1">Culture &amp; history</button>
          <button type="button" class="dp-tab" role="tab" id="dp-tab-health" data-tab="health" aria-controls="dp-panel-health" aria-selected="false" tabindex="-1">Health info</button>
        </div>
        <div class="dp-body" id="dp-body">
          <div class="dp-panel" id="dp-panel-recipe" role="tabpanel" aria-labelledby="dp-tab-recipe"></div>
          <div class="dp-panel" id="dp-panel-culture" role="tabpanel" aria-labelledby="dp-tab-culture" hidden></div>
          <div class="dp-panel" id="dp-panel-health" role="tabpanel" aria-labelledby="dp-tab-health" hidden></div>
        </div>
      </section>
    </div>
  </div>

{# Site icons. Included in every page's <head>. #}
<link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='assets/icons/favicon-32.png') }}">
<link rel="icon" type="image/png" sizes="64x64" href="{{ url_for('static', filename='assets/icons/favicon-64.png') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='assets/icons/apple-touch-icon.png') }}">
<script>
  /* The site was once an installable app (PWA). Remove its service worker and saved copies
     from browsers that still have them, so every page loads fresh from the server. */
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations()
      .then((regs) => regs.forEach((r) => r.unregister()))
      .catch(() => {});
  }
  if (window.caches) {
    caches.keys()
      .then((keys) => keys.filter((k) => k.startsWith('cuisync-')).forEach((k) => caches.delete(k)))
      .catch(() => {});
  }
</script>
